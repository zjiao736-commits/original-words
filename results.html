<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>采集结果 · 我的语料库</title><style>body{max-width:950px;margin:55px auto;padding:22px;background:#f5f4f0;color:#252525;font:17px/1.8 system-ui}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}section{padding:26px;background:white;border-radius:16px}h1{font-size:34px}h2{margin-top:0}a{display:inline-block;color:#6359c9;margin:8px 14px 8px 0}strong{font-size:23px}small{color:#666}</style><h1>你的原话，已保存到本机。</h1><p>2026年11月6日 · 本次发现的对话已完成采集与导出</p><div class="grid" id="cards"></div><p id="check"></p><section><h2>保留了什么</h2><p>“我的原话”只展示你说过的话，保留口语和顺序，不润色。原始对话JSON保留用户与AI的角色，原始采集快照另外存放在本机数据库。</p><small>仅覆盖本次侧栏发现的历史，未与平台服务端总数比对；未下载附件。当前分类仍是关键词规则，深度整理尚未接入。Gemini和ChatGPT登录问题暂未处理。</small></section><p><a href="/">浏览和搜索档案 →</a><a href="/setup">采集管理 →</a></p><script>
fetch('/api/report').then(r=>r.json()).then(report=>{for(const [name,s] of Object.entries(report.platforms)){const key=name==='DeepSeek'?'deepseek':'doubao';const card=document.createElement('section'),h=document.createElement('h2'),n=document.createElement('strong'),p=document.createElement('p');h.textContent=name;n.textContent=s.saved+' 条对话';p.textContent=s.user_messages.toLocaleString()+' 条你的发言 · '+s.characters.toLocaleString()+' 字符';card.append(h,n,p);for(const [kind,label] of [['user','下载我的原话 Markdown'],['raw','下载原始对话 JSON']]){const a=document.createElement('a');a.href='/download?platform='+key+'&kind='+kind;a.textContent=label;card.append(a)}document.getElementById('cards').append(card)}document.getElementById('check').textContent=report.snapshot_consistency_checked+' 条对话已核对入库文字、角色与顺序和采集快照一致。';}).catch(()=>document.getElementById('check').textContent='报告读取失败，请重新启动本地工具。');
</script></html>
