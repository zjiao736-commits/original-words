</style><section><div class="runner-brand"><img src="icons/yuanhua.svg" width="30" height="30" alt="原话标识"><span>原话 <small>YOUR PERSONAL ARCHIVE</small></span></div><h1 id="title">普通 Chrome · 后台采集</h1><p>连接普通 Chrome 中的平台页面。未打开时会自动打开；需要登录时，请在平台自己的页面完成。</p><div><label id="account-label">账号标记 <input id="account" placeholder="例如：常用账号、备用账号" value="默认账号"></label> <label id="source-picker">选择平台页面 <select id="source-tab"><option value="">请先选择页面</option></select></label><button id="open-platform" hidden>手动打开平台</button><button id="refresh-tabs">重新检测</button><button id="select-account">连接平台</button></div><p id="account-state">尚未关联平台页面。点击连接后自动打开并检测，无需从扩展菜单再次进入。</p><div class="main-actionbar"><button id="collect-all">开始采集</button><button id="pause">暂停</button><button id="archive">返回资料库</button></div><details id="advanced-actions"><summary>更多操作</summary><div><button id="discover">仅扫描历史</button><button id="capture-current">读取当前对话</button><button id="test-one">测试一篇</button><button id="start">继续队列</button><button id="retry">重试失败项</button></div></details><p id="status">准备连接…</p><progress id="progress" max="100" value="0"></progress><p id="counts"></p><details class="diagnostics"><summary>查看诊断与范围说明</summary><pre id="warnings"></pre></details><small>可切换到其他标签页继续工作，保留这个后台采集页即可。关闭控制台不影响本页；关闭此采集页会暂停，下次打开可继续。仅发现的历史会进入队列，无法证明账号历史已全部列出。</small></section><script src="runner.js"></script></html>
